
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Our World ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div class="background-glow"></div>
    <div id="heart-container"></div>

    <main class="login-screen">

        <!-- Lock Icon -->
        <div class="lock-icon">
            <svg viewBox="0 0 64 64" fill="none">
                <path d="M19 27V19C19 11.8 24.8 6 32 6C39.2 6 45 11.8 45 19V27"
                    stroke="#ff80bb" stroke-width="3.5" stroke-linecap="round"/>
                <rect x="12" y="25" width="40" height="33" rx="13"
                    fill="#ff4d91"/>
                <path d="M32 35C28.8 35 26.5 37.3 26.5 40.2C26.5 42 27.4 43.5 28.8 44.5V49H35.2V44.5C36.6 43.5 37.5 42 37.5 40.2C37.5 37.3 35.2 35 32 35Z"
                    fill="#5b092b"/>
            </svg>
        </div>

        <!-- Heading -->
        <h1>Access Our World</h1>

        <p class="subtitle">
            A special place, just for you <span>♥</span>
        </p>

        <!-- Login Card -->
        <form class="login-card" id="login-form">

            <div class="input-group">

                <span class="input-icon">♙</span>

                <input
                    type="text"
                    id="username"
                    value="Tharveen"
                    placeholder="Username"
                    autocomplete="off"
                    required
                >

            </div>

            <div class="input-group">

                <span class="input-icon">♙</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    value="22••••••••••"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="toggle-password"
                    aria-label="Show password"
                >
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M2 12S5.5 5.5 12 5.5S22 12 22 12S18.5 18.5 12 18.5S2 12 2 12Z"
                            stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="12" cy="12" r="3"
                            stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                </button>

            </div>

            <button type="submit" class="unlock-button">
                Unlock Surprise <span>♥</span>
            </button>

        </form>

        <!-- Footer -->
        <footer>
            <span>♥</span> Made with love by Kamali
        </footer>

    </main>

    <script src="js/effects.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
